<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD Sayangku!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-blue-1: #a2d2ff;
            --bg-blue-2: #bde0fe;
            --bg-blue-3: #90e0ef;
            --pink-cake: #ffafcc;
            --cream: #ffffff;
            --pixel-border: 4px solid #000;
        }

        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-blue-1);
        }

        /* Statis Pixel Art Background */
        .pixel-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(45deg, var(--bg-blue-2) 25%, transparent 25%), 
                linear-gradient(-45deg, var(--bg-blue-2) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--bg-blue-3) 75%),
                linear-gradient(-45deg, transparent 75%, var(--bg-blue-3) 75%);
            background-size: 40px 40px; z-index: -1; opacity: 0.5;
        }

        .container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; text-align: center;
            padding: 20px;
        }

        /* UI Elements */
        .pixel-box {
            background: white; border: var(--pixel-border);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
            padding: 25px; border-radius: 20px; max-width: 90%;
            position: relative; z-index: 10;
        }

        .btn-pixel {
            margin-top: 20px; padding: 15px 20px;
            background: #bdc3c7; border: var(--pixel-border);
            cursor: pointer; font-family: 'Press Start 2P', cursive;
            font-size: 10px; border-radius: 5px;
        }

        /* Envelope Style */
        #envelope-wrapper { display: none; }
        .envelope {
            width: 150px; height: 100px; background: #f3e5ab; /* Krem */
            border: var(--pixel-border); position: relative; cursor: pointer;
        }
        .envelope::after {
            content: ""; position: absolute; top: 0; left: 0;
            border-left: 75px solid transparent; border-right: 75px solid transparent;
            border-top: 50px solid #e5d38f;
        }
        .heart {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            color: #ff0000; font-size: 30px; z-index: 5; animation: beat 0.8s infinite;
        }
        @keyframes beat { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } }

        /* Letter Styling */
        #letter-page { display: none; }
        .letter {
            background: #fff; border: var(--pixel-border); padding: 20px;
            width: 320px; min-height: 400px; font-size: 10px; line-height: 1.8;
            text-align: left; overflow: hidden;
        }

        /* Cake & Melt Animation */
        #cake-container { position: relative; width: 200px; height: 220px; display: none; margin-top: 20px; }
        .layer {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 180px; height: 30px; border: 3px solid #000; opacity: 0;
        }
        .pink-layer { background: var(--pink-cake); background-image: radial-gradient(#ff0000 15%, transparent 15%); background-size: 20px 20px; }
        .cream-layer { background: var(--cream); border-radius: 0; }
        .melt { 
            position: absolute; top: 25px; left: 10px; width: 10px; height: 15px; 
            background: var(--cream); border-radius: 0 0 5px 5px; border: 2px solid #000; border-top: none;
        }

        .lay1 { bottom: 0; } .lay2 { bottom: 30px; } .lay3 { bottom: 60px; } 
        .lay4 { bottom: 90px; } .lay5 { bottom: 120px; } .lay6 { bottom: 150px; }

        .candles-26 {
            position: absolute; bottom: 185px; left: 50%; transform: translateX(-50%);
            display: none; gap: 15px; font-size: 30px; color: #f1c40f; -webkit-text-stroke: 2px #000;
        }
        .flame {
            position: absolute; top: -15px; left: 50%; width: 12px; height: 18px;
            background: #ff9f1c; border-radius: 50%; transform: translateX(-50%);
            animation: flicker 0.2s infinite alternate; box-shadow: 0 0 10px #ff9f1c;
        }

        @keyframes flicker { from { opacity: 0.8; transform: translateX(-50%) scale(1); } to { opacity: 1; transform: translateX(-50%) scale(1.2); } }

        #hbd-firework {
            position: fixed; top: 20%; width: 100%; color: #ff0054;
            font-size: 20px; display: none; text-shadow: 4px 4px #fff; z-index: 1000;
        }

        .flying { position: fixed; bottom: -100px; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>

    <div class="pixel-bg"></div>
    <audio id="bgMusic" loop><source src="https://files.catbox.moe/v2tpxh.mp3" type="audio/mpeg"></audio>

    <!-- HALAMAN 1 -->
    <div id="page1" class="container">
        <div class="pixel-box">
            <p style="font-size: 12px; line-height: 1.5;">Siapa ya yang hari ini ulang tahun?</p>
            <p style="font-size: 9px; margin-top: 10px;">Kalau benar kamu hari ini ulang tahun, kamu bisa menekan tombol di bawah ini</p>
            <button class="btn-pixel" onclick="showEnvelope()">Press</button>
        </div>
    </div>

    <!-- HALAMAN ENVELOPE -->
    <div id="envelope-wrapper" class="container">
        <p style="font-size: 10px; margin-bottom: 20px;">Ada pesan untukmu...</p>
        <div class="envelope" onclick="openLetter()">
            <div class="heart">❤</div>
        </div>
        <p style="font-size: 8px; margin-top: 20px;">(Tekan hati untuk membuka)</p>
    </div>

    <!-- HALAMAN SURAT -->
    <div id="letter-page" class="container">
        <div class="letter" id="typewriter"></div>
        <button class="btn-pixel" id="btnSurprise" style="display:none;" onclick="startCake()">Surprise</button>

        <!-- CAKE SECTION -->
        <div id="cake-container">
            <div id="btn-gift-pos"></div>
            <div class="layer pink-layer lay1"></div>
            <div class="layer cream-layer lay2"><div class="melt"></div><div class="melt" style="left:150px;"></div></div>
            <div class="layer pink-layer lay3"></div>
            <div class="layer cream-layer lay4"><div class="melt" style="left:80px;"></div></div>
            <div class="layer pink-layer lay5"></div>
            <div class="layer cream-layer lay6"></div>
            
            <div class="candles-26" id="candles">
                <div style="position:relative;">2<div class="flame"></div></div>
                <div style="position:relative;">6<div class="flame"></div></div>
            </div>
        </div>
    </div>

    <div id="hbd-firework">HAPPY BIRTHDAY!</div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const music = document.getElementById('bgMusic');
        const text = [
            "Ciee.. yang sekarang udah 26 tahun",
            "Selamat Ulang Tahun ya Sayangku",
            "Gimana rasanya jadi dewasa, sayang ?",
            "Berat ya ? tapi kamu kuat kan, kamu kan selalu kuat untuk menghadapi kehidupan ini",
            "Semoga kamu selalu dilindungi dan selalu mendapatkan kebaikan di dalam hidup ini ya sayang",
            "Aku sayang kamu",
            "Klik tombol dibawah ini ya, aku punya surprise kecil buat kamu"
        ];

        function showEnvelope() {
            music.play();
            document.getElementById('page1').style.display = 'none';
            document.getElementById('envelope-wrapper').style.display = 'flex';
        }

        function openLetter() {
            document.getElementById('envelope-wrapper').style.display = 'none';
            document.getElementById('letter-page').style.display = 'flex';
            typeWriter(0);
        }

        function typeWriter(i) {
            if (i < text.length) {
                let j = 0;
                let currentPara = document.createElement('p');
                document.getElementById('typewriter').appendChild(currentPara);
                
                function innerType() {
                    if (j < text[i].length) {
                        currentPara.innerHTML += text[i].charAt(j);
                        j++;
                        setTimeout(innerType, 50);
                    } else {
                        setTimeout(() => typeWriter(i + 1), 500);
                    }
                }
                innerType();
            } else {
                document.getElementById('btnSurprise').style.display = 'inline-block';
            }
        }

        function startCake() {
            document.getElementById('btnSurprise').style.display = 'none';
            document.getElementById('typewriter').style.display = 'none';
            document.getElementById('cake-container').style.display = 'block';
            
            const layers = document.querySelectorAll('.layer');
            layers.forEach((layer, index) => {
                setTimeout(() => {
                    layer.style.opacity = '1';
                    layer.animate([
                        { transform: 'translate(-50%, -200px)', borderRadius: '40%' },
                        { transform: 'translate(-50%, 0)', borderRadius: '0' }
                    ], { duration: 1200, easing: 'ease-out', fill: 'forwards' });
                }, index * 1300);
            });

            setTimeout(() => {
                document.getElementById('candles').style.display = 'flex';
                showFireworks();
            }, 8500);
        }

        function showFireworks() {
            const f = document.getElementById('hbd-firework');
            f.style.display = 'block';
            let timer = 0;
            let interval = setInterval(() => {
                confetti({ particleCount: 10, spread: 100, origin: { y: 0.3 } });
                timer++;
                if(timer > 30) {
                    clearInterval(interval);
                    f.style.display = 'none';
                    showGiftButton();
                }
            }, 150);
        }

        function showGiftButton() {
            const btn = document.createElement('button');
            btn.className = 'btn-pixel';
            btn.style.position = 'absolute';
            btn.style.top = '-60px';
            btn.style.left = '50%';
            btn.style.transform = 'translateX(-50%)';
            btn.innerText = "GIFT";
            btn.onclick = spawnFinalSurprise;
            document.getElementById('btn-gift-pos').appendChild(btn);
        }

        function spawnFinalSurprise() {
            const items = ['🌸', '🌹', '🌷', '🌻', '🎈', '✨', '🎂'];
            for(let i=0; i<50; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'flying';
                    el.innerHTML = items[Math.floor(Math.random()*items.length)];
                    el.style.left = Math.random() * 100 + "vw";
                    el.style.fontSize = "30px";
                    document.body.appendChild(el);
                    el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-120vh) rotate(360deg)' }], { duration: 5000 });
                }, i * 100);
            }
        }
    </script>
</body>
</html>
